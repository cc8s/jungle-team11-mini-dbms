name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
      - run: make sqltest

  asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make asan

  tsan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make tsan
